<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Tarifa - Demo</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-dollar-sign mr-2"></i>Configurar Tarifa de Consulta</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i>
                            Establezca su tarifa fija por consulta. Esta tarifa se usará automáticamente al generar facturas para sus pacientes.
                        </div>
                        
                        <form id="form-tarifa">
                            <div class="form-group">
                                <label for="tarifa">Tarifa por consulta (USD)</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">$</span>
                                    </div>
                                    <input type="number" class="form-control" id="tarifa" name="tarifa" 
                                           value="50.00" step="0.01" min="0" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text">USD</span>
                                    </div>
                                </div>
                                <small class="form-text text-muted">Ingrese el monto en dólares estadounidenses</small>
                            </div>
                            
                            <div class="form-group">
                                <label>Tarifa actual</label>
                                <div class="alert alert-secondary">
                                    <strong>$50.00 USD</strong>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="fas fa-save"></i> Guardar Tarifa
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    $('#form-tarifa').submit(function(e) {
        e.preventDefault();
        
        const tarifa = parseFloat($('#tarifa').val());
        
        if (tarifa < 0) {
            alert('La tarifa no puede ser negativa');
            return;
        }
        
        alert('Tarifa actualizada exitosamente: $' + tarifa.toFixed(2) + ' USD\n\nFuncionalidad completa cuando las tablas estén creadas');
    });
    </script>
</body>
</html>
